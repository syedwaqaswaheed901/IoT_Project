<!DOCTYPE html>
<html>

<head>
    <title>Twitter Sentimental App</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>

    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <!-- <link rel='stylesheet' type='text/css' media='screen' href='main.css'> -->
    <!-- <script src='main.js'></script> -->
    <script>


    </script>
</head>

<body>
    <div class="container-fluid">
        <nav class="navbar navbar-light bg-light">
            <div class="container-fluid">
                <!-- <a class="navbar-brand">Please enter hashtag for for getting tweets</a> -->
                <form class="d-flex">
                    <input class="form-control me-2" id="hashtag" type="search" placeholder="Enter hashtag"
                        aria-label="Search">
                    <input class="form-control me-2" id="count" type="number" placeholder="Enter tweets"
                        aria-label="Search" value="5">
                    <button class="btn btn-outline-success" type="button" id="hashtag-btn">Get Tweets</button>

                </form>
                <p id="status">

                </p>
            </div>
        </nav>

        <div class="row ">
            <div class="col-sm-7 " style="height:800px;">
                <div id="tweets-table">

                </div>
            </div>
            <div class="col-sm-5" style="height:500px;">
                <div class="row  chart-container">
                    <div id="div-piChart">
                        <canvas id="piChart" style="height:200px;"></canvas>
                    </div>
                </div>
                <div class="row  chart-container">
                    <div id="div-barChart">
                        <canvas id="barChart" style="height:200px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row" style="border:3px solid black;"></div>
        <div class="row" style="height: 100px;">
            <div class="row">
                <div class="col-sm-4" id="pos">

                </div>
                <div class="col-sm-4" id="neg">

                </div>
                <div class="col-sm-4" id="neu">

                </div>
            </div>

        </div>




    </div>








    <link href="https://unpkg.com/tabulator-tables@4.2.7/dist/css/tabulator.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://unpkg.com/tabulator-tables@4.2.7/dist/js/tabulator.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.4.0/Chart.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->

    <script>

        $("#hashtag-btn").click(function () {
            var hashtag = $('#hashtag').val();
            var count = $('#count').val();
            $('#status').html('Please wait fetching and performing sentiment analysis...');

            $('#div-barChart').html('<canvas id="barChart" style="height:200px;"></canvas>');
            $('#div-piChart').html('<canvas id="piChart" style="height:200px;"></canvas>');

            $.post("/getTweets", { 'hashtag': hashtag, 'count': count }).done(function (data) {

                // console.log("Data Loaded: " + data);
                var table = new Tabulator("#tweets-table", {
                    layout: "fitDataFill",
                    height: "700px",
                    // data: tabledata, //assign data to table
                    autoColumns: true, //create columns from data field names
                });
                table.setData(data)
                $.post("/get_piInfo").done(function (pidata) {

                    var piChart_ = new Chart('piChart', {
                        type: 'pie',
                        // responsive: true,
                        maintainAspectRatio: false,
                        data: {
                            labels: pidata['l'],
                            datasets: [{
                                backgroundColor: [
                                    "#2ecc71",
                                    "#3498db",
                                    "#95a5a6",
                                ],
                                data: pidata['d']
                            }]
                        },
                        options: {
                            title: {
                                display: true,
                                text: 'Count of tweets sentiments'
                            }
                        }
                    });

                    var barChart_ = new Chart("barChart", {
                        type: "bar",
                        // responsive: true,
                        maintainAspectRatio: false,
                        data: {
                            labels: pidata['l'],
                            datasets: [{
                                backgroundColor: [
                                    "#2ecc71",
                                    "#3498db",
                                    "#95a5a6",
                                ],
                                data: pidata['d']
                            }]
                        },
                        options: {
                            legend: { display: false },
                            title: {
                                display: true,
                                text: "Count of tweets sentiments"
                            }
                        }
                    });

                    $('#status').html('Done');

                });
                $.post("/get_wcInfo").done(function (wcdata) {
                    $('#pos').html("<h2>Positive WordCloud</h2><img src=" + wcdata['pos'] + " alt='Positive word cloud' width='70%'>")
                    $('#neg').html("<h2>Negative WordCloud</h2><img src=" + wcdata['neg'] + " alt='Negative word cloud' width='70%'>")
                    $('#neu').html("<h2>Neutral WordCloud</h2><img src=" + wcdata['neu'] + " alt='Neutral word cloud' width='70%'>")

                });
            });



        });
    </script>

</body>

</html>
